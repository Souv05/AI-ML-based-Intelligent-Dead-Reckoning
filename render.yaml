services:
  - type: web
    name: dead-reckoning-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-server.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ROAD_GRAPH_URL
        sync: false   # set manually in Render dashboard → Environment
    healthCheckPath: /health
